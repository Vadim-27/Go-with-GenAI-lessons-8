openapi: 3.0.3
info:
  title: LibraTrack Books API
  description: |
    REST API для ресурсу книжок (варіант `books`).
    Сховище в пам'яті: дані зникають після перезапуску сервера.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальний сервер

tags:
  - name: system
    description: Службові ендпоінти
  - name: books
    description: Операції з книжками

paths:
  /health:
    get:
      tags: [system]
      summary: Перевірка, що сервіс працює
      operationId: health
      responses:
        "200":
          description: Сервіс працює
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/books:
    get:
      tags: [books]
      summary: Список книжок
      description: |
        Порядок завжди за `id` за зростанням. Порожня колекція повертається як `[]`.
        Фільтр `category` збігається точно і чутливий до регістру; порожнє значення означає «без фільтра».
        Сторінка за межами даних дає `[]`.
      operationId: listBooks
      parameters:
        - name: page
          in: query
          description: Номер сторінки (ціле число >= 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Розмір сторінки (ціле число >= 1). Значення більше 100 замінюється на 100.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: category
          in: query
          description: Показати лише книжки з цією категорією.
          schema:
            type: string
          example: programming
      responses:
        "200":
          description: Масив книжок (може бути порожнім)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
        "400":
          description: Некоректні `page` або `limit` (код `invalid_pagination`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_pagination
                  message: Invalid page
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [books]
      summary: Створити книжку
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Книжку створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/books/{id}:
    parameters:
      - $ref: "#/components/parameters/BookID"

    get:
      tags: [books]
      summary: Отримати книжку за id
      operationId: getBook
      responses:
        "200":
          description: Знайдена книжка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/InvalidID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [books]
      summary: Повністю замінити книжку
      description: |
        Обов'язкові поля замінюються, а необов'язкові, яких немає в тілі, стають `null`.
        `id` і `created_at` не змінюються, `updated_at` оновлюється.
        Порядок перевірок: спочатку `id` (400), потім тіло (422), потім існування (404).
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "200":
          description: Збережена книжка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/InvalidID"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [books]
      summary: Видалити книжку
      description: Видалений `id` більше ніколи не використовується повторно.
      operationId: deleteBook
      responses:
        "204":
          description: Книжку видалено, тіла відповіді немає
        "400":
          $ref: "#/components/responses/InvalidID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    BookID:
      name: id
      in: path
      required: true
      description: Ідентифікатор книжки, ціле число від 0 до 4294967295.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 4294967295
      example: 1

  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - isbn
        - author
        - category
        - published_year
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        title:
          type: string
          example: The Go Programming Language
        isbn:
          type: string
          example: "9780134190440"
        author:
          type: string
          example: Donovan, Kernighan
        category:
          type: string
          example: programming
        published_year:
          type: integer
          nullable: true
          example: 2015
        description:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-10-05T12:00:00.123456Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-05T12:00:00.123456Z"

    BookInput:
      type: object
      required: [title, isbn, author, category]
      properties:
        title:
          type: string
          minLength: 1
          description: Не може бути порожнім або складатися лише з пробілів.
          example: The Go Programming Language
        isbn:
          type: string
          minLength: 1
          description: Не може бути порожнім або складатися лише з пробілів.
          example: "9780134190440"
        author:
          type: string
          minLength: 1
          description: Не може бути порожнім або складатися лише з пробілів.
          example: Donovan, Kernighan
        category:
          type: string
          minLength: 1
          description: Не може бути порожнім або складатися лише з пробілів. Це поле використовується як фільтр у списку.
          example: programming
        published_year:
          type: integer
          nullable: true
          example: 2015
        description:
          type: string
          nullable: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_id
                - invalid_pagination
                - validation_error
                - not_found
                - internal_server_error
            message:
              type: string

  responses:
    InvalidID:
      description: Некоректний `id` (код `invalid_id`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_id
              message: Invalid book id
    NotFound:
      description: Книжку не знайдено (код `not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Book not found
    ValidationError:
      description: |
        Тіло запиту некоректне (код `validation_error`): зіпсований JSON, порожнє тіло, масив,
        відсутнє чи порожнє обов'язкове поле, або поле неправильного типу.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Invalid request body
    InternalServerError:
      description: Внутрішня помилка сервера. Подробиці не розкриваються, вони пишуться лише в лог.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_server_error
              message: Internal server error
